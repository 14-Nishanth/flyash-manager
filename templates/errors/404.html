{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm p-5 mx-auto rounded-4" style="max-width: 550px;">
        <div class="text-warning mb-3">
            <i class="bi bi-exclamation-diamond-fill" style="font-size: 4rem;"></i>
        </div>
        <h2 class="fw-bold text-dark">404 - Page Not Found</h2>
        <p class="text-muted mt-2">The page or resource you are trying to access does not exist or has been moved.</p>
        <div class="mt-4 d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-primary px-4 fw-semibold">
                <i class="bi bi-house-door-fill me-1"></i> Go to Dashboard
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-3">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
