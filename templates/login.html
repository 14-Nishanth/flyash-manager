<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1e293b">
    <title>Sign In - FlyAsh Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-container">
            <div class="card login-card shadow-lg border-0">
                <div class="card-body p-4 p-sm-5">
                    
                    <!-- Plant Brand Header -->
                    <div class="text-center mb-4">
                        <div class="login-brand-icon mx-auto mb-3">
                            <i class="bi bi-building-fill"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-1 fs-3">FlyAsh Manager</h2>
                        <p class="text-muted small mb-0">Brick & Block Plant Management System</p>
                    </div>

                    <!-- Alert Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show py-2 px-3 small rounded-3"
                                     role="alert">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-{{ 'exclamation-circle-fill' if category == 'error' else 'check-circle-fill' }} me-2"></i>
                                        <div>{{ message }}</div>
                                    </div>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Login Form -->
                    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary small text-uppercase">
                                Username or Email
                            </label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-person-fill fs-5"></i>
                                </span>
                                <input type="text" class="form-control form-control-lg bg-light border-start-0 ps-0" 
                                       id="username" name="username"
                                       placeholder="e.g. admin or username" 
                                       autocomplete="username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary small text-uppercase">
                                Password
                            </label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-lock-fill fs-5"></i>
                                </span>
                                <input type="password" class="form-control form-control-lg bg-light border-start-0 border-end-0 ps-0" 
                                       id="password" name="password"
                                       placeholder="Enter your password" 
                                       autocomplete="current-password" required>
                                <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePasswordBtn" title="Show/Hide Password">
                                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-3 shadow-sm login-submit-btn">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Plant
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <small class="text-muted d-block">
                            <i class="bi bi-shield-check text-success me-1"></i> Secure Cloud Session & Device Sync
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility for easy typing on mobile devices
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
            });
        }
    </script>
</body>
</html>
